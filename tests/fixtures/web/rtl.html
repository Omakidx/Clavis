<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RTL text</title>
    <style>
      body {
        margin: 0;
        font:
          20px/1.8 'Noto Naskh Arabic',
          'DejaVu Sans',
          system-ui,
          sans-serif;
      }
      main {
        max-width: 38rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>مكتبة المدينة</h1>
      <p id="ar">
        في قديم الزمان كانت المكتبة الكبيرة تقف على ضفة النهر، وكان الناس يأتون إليها كل مساء لقراءة
        الكتب القديمة والاستماع إلى القصص.
      </p>
      <p id="he" lang="he" dir="rtl">
        הספרייה העתיקה עמדה על גדת הנהר במשך מאות שנים, ואנשים באו אליה בכל ערב לקרוא ספרים ישנים.
      </p>
      <p id="mixed" lang="ar">
        يعمل المطور على مشروع <span dir="ltr">Clavis</span> منذ عام ٢٠٢٤ مع فريق صغير.
      </p>
    </main>
  </body>
</html>
