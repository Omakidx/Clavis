<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>混在テキスト: 中文 日本語 English</title>
    <style>
      body {
        margin: 0;
        font:
          18px/1.9 'Noto Sans CJK JP',
          'Noto Sans JP',
          'DejaVu Sans',
          sans-serif;
        color: #222;
      }
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>旅行ノート</h1>
      <p id="cj-ja" lang="ja">
        京都の朝は静かで、古い寺の鐘の音がゆっくりと街に広がります。私たちは小さな喫茶店で温かいお茶を飲みました。
      </p>
      <p id="cj-zh" lang="zh-CN">
        我们在上海的老街散步，路边的小店卖着各种热腾腾的包子。老板笑着说这是他家三代人传下来的配方。
      </p>
      <p id="cj-mix" lang="en">
        The conference badge read <b>Tokyo Metropolitan Station</b> in English, while the signs
        outside said 東京都庁前駅 in Japanese and the guide explained both versions patiently.
      </p>
    </main>
  </body>
</html>
