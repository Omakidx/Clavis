<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>כתבה: שוק הכרמל</title>
    <style>
      body {
        margin: 0;
        font:
          20px/1.8 'Noto Sans Hebrew',
          'DejaVu Sans',
          Arial,
          sans-serif;
        color: #222;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }
      .en {
        direction: ltr;
        unicode-bidi: isolate;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>הכתבה של השבוע</h1>
      <p id="he-1">
        השוק הישן נפתח מוקדם בבוקר, והמוכרים מסדרים את הפירות על הדוכנים בקפידה רבה. ריח של לחם טרי
        ממלא את הסמטאות הצרות.
      </p>
      <p id="he-2">
        תיירים רבים מגיעים לטעום את החומוס המפורסם, אבל התושבים המקומיים מעדיפים את הפלאפל מהדוכן
        הקטן בפינה.
      </p>
      <p id="he-3">
        הקלטה של המקום נשמרת בארכיון <span class="en">City Sound Library</span> מאז שנת אלפיים.
      </p>
    </main>
  </body>
</html>
