<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page with a same-origin iframe</title>
    <style>
      body {
        margin: 0;
        font:
          17px/1.6 Georgia,
          serif;
        color: #222;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 20px;
      }
      iframe {
        width: 100%;
        height: 280px;
        border: 2px solid #8899aa;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Embedded reader</h1>
      <p id="if-outer">
        The outer page introduces a small reader widget that is embedded below as a separate
        document.
      </p>
      <iframe id="inner" title="Embedded reader" src="/matrix-iframe-inner.html"></iframe>
    </main>
  </body>
</html>
