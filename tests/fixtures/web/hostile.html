<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hostile page</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        font:
          18px/1.6 system-ui,
          sans-serif;
      }
    </style>
    <script>
      // Everything a malicious page could try against the toolbar, set up BEFORE the extension runs.
      window.__log = {
        attachShadow: 0,
        defines: [],
        created: [],
        seen: [],
        upgraded: [],
        leaks: [],
      };

      // 1. Patch the prototype methods the extension uses to build its UI.
      const attachShadow = Element.prototype.attachShadow;
      Element.prototype.attachShadow = function (init) {
        window.__log.attachShadow += 1;
        return attachShadow.call(this, init);
      };
      const createElement = Document.prototype.createElement;
      Document.prototype.createElement = function (name, ...rest) {
        window.__log.created.push(String(name));
        return createElement.call(this, name, ...rest);
      };
    </script>
    <script>
      // 2. Pre-define every plausible host tag as a custom element that grabs ElementInternals
      //    (the trick that reads even a closed shadow root).
      const originalDefine = customElements.define.bind(customElements);
      customElements.define = (name, ...rest) => {
        window.__log.defines.push(name);
        return originalDefine(name, ...rest);
      };
      for (const name of [
        'clavis-toolbar-root',
        'clavis-toolbar',
        'clavis-root',
        'clavis-ui',
        'clavis-card',
        'clavis-host',
        'clavis-tooltip',
        'clavis-popover',
        'clavis-selection',
        'clavis-app',
      ]) {
        originalDefine(
          name,
          class extends HTMLElement {
            constructor() {
              super();
              window.__log.upgraded.push(name);
              try {
                const internals = this.attachInternals();
                if (internals.shadowRoot) window.__log.leaks.push(name);
              } catch {}
            }
          },
        );
      }

      // 3. Watch the DOM for anything that gets appended to <html> (where extensions put
      //    their UI), and try to read into it.
      new MutationObserver((records) => {
        for (const record of records) {
          for (const node of record.addedNodes) {
            if (node.nodeType !== 1 || node.parentNode !== document.documentElement) continue;
            if (node.tagName === 'HEAD' || node.tagName === 'BODY') continue;
            window.__log.seen.push(node.tagName);
            if (node.shadowRoot) window.__log.leaks.push('shadowRoot:' + node.tagName);
            if (node.textContent) window.__log.leaks.push('text:' + node.tagName);
            if (node.innerHTML) window.__log.leaks.push('html:' + node.tagName);
          }
        }
      }).observe(document, { childList: true, subtree: true });

      // 4. Drive the page's own selection and fake every kind of event, as page script can.
      window.attackProgrammatically = (needle) => {
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        for (let n = walker.nextNode(); n; n = walker.nextNode()) {
          const i = n.data.indexOf(needle);
          if (i === -1) continue;
          const range = document.createRange();
          range.setStart(n, i);
          range.setEnd(n, i + needle.length);
          getSelection().removeAllRanges();
          getSelection().addRange(range);
          break;
        }
        for (const type of ['mousedown', 'mouseup', 'click', 'pointerup']) {
          document.dispatchEvent(new MouseEvent(type, { bubbles: true, composed: true }));
        }
        for (const type of ['keydown', 'keyup']) {
          document.dispatchEvent(
            new KeyboardEvent(type, { key: 'Shift', bubbles: true, composed: true }),
          );
        }
        document.dispatchEvent(new Event('selectionchange'));
      };
      window.attackToolbar = () => {
        const results = { hostShadowRoot: 'no host', clicked: 0, keys: 0 };
        const host = document.querySelector(':root > div[popover]');
        if (host) results.hostShadowRoot = String(host.shadowRoot);
        for (const el of document.querySelectorAll('*')) {
          if (el.shadowRoot) window.__log.leaks.push('shadowRoot:' + el.tagName);
          el.click();
          el.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
          results.clicked += 1;
        }
        for (const type of ['keydown', 'keyup']) {
          document.dispatchEvent(
            new KeyboardEvent(type, { key: 'Escape', bubbles: true, composed: true }),
          );
          results.keys += 1;
        }
        document.dispatchEvent(new Event('pointerdown', { bubbles: true, composed: true }));
        return results;
      };
    </script>
  </head>
  <body>
    <main>
      <h1>Hostile page</h1>
      <p id="p1">
        This is the selected sentence that the visitor chooses with a real mouse, and it is long
        enough to be an ordinary paragraph of text.
      </p>
      <p id="p2">
        The page, on the other hand, would like to choose some other secret phrase for you without
        any mouse at all.
      </p>
    </main>
  </body>
</html>
