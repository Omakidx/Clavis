<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vertical writing mode</title>
    <style>
      body {
        margin: 0;
        padding: 1.5rem;
        font:
          20px/1.8 system-ui,
          'Noto Sans CJK JP',
          sans-serif;
      }
      #column {
        writing-mode: vertical-rl;
        height: 320px;
        margin: 0 0 0 auto;
        width: 240px;
        border: 1px solid #ccc;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <p id="top">Horizontal paragraph with the word anchor above vertical text.</p>
    <div id="column">
      <p id="v">
        Vertical english text flows downward in columns, with the word lantern in the middle of it
        and plenty of further words to wrap into a second column.
      </p>
    </div>
    <script>
      // ?mode=lr switches the column to vertical-lr.
      if (new URLSearchParams(location.search).get('mode') === 'lr') {
        document.getElementById('column').style.writingMode = 'vertical-lr';
      }
    </script>
  </body>
</html>
