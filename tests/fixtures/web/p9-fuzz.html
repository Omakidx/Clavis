<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phase 9 fuzz page</title>
    <style>
      body {
        margin: 0;
        font:
          18px/1.6 Georgia,
          serif;
        color: #222;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 3rem 1rem 8rem;
      }
      p {
        white-space: normal;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The Phase 9 fuzz specs replace the text of these three paragraphs (as plain text, never as markup). -->
      <p id="before">Text before the selection.</p>
      <p id="fuzz">Selected text placeholder.</p>
      <p id="after">Text after the selection.</p>
    </main>
  </body>
</html>
