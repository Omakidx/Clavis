# Gitleaks configuration (https://github.com/gitleaks/gitleaks), used by CI and
# `node scripts/scan-secrets.mjs`. Extends the default ruleset and adds the Groq key format,
# which the default rules do not cover. docs/README.md "Environment and configuration policy":
# no API key or .env file may ever be committed or packaged.
title = "Clavis gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "groq-api-key"
description = "Groq API key (gsk_ prefix)"
regex = '''\bgsk_[A-Za-z0-9]{20,}\b'''
keywords = ["gsk_"]
tags = ["key", "groq"]

# Fake keys in tests must carry an obvious marker so they never look like real ones, e.g.
# "gsk_TESTxxxxxxxxxxxxxxxxxxxxxxxx" or "gsk_FAKE...". A real key never starts with these words.
[[allowlists]]
description = "Clearly fake Groq keys used in tests and docs"
targetRules = ["groq-api-key", "generic-api-key"]
regexes = ['''gsk_(?:TEST|FAKE|EXAMPLE|DUMMY|MOCK|REDACTED)[A-Za-z0-9_]*''']

# Only matters for `gitleaks dir` (working-tree scans): these directories are generated or
# third-party and are never committed. `gitleaks git` (CI) scans commits and ignores them anyway.
[[allowlists]]
description = "Generated and third-party directories"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.output/''',
  '''(^|/)\.output-[^/]+/''',
  '''(^|/)\.wxt/''',
  '''(^|/)coverage/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
]

# Passwords of the encrypted test PDFs (tests/fixtures/pdf/accept/encrypted-*.pdf). They only
# unlock those fixtures, so they are test data, not secrets. The Groq key rule still applies.
[[allowlists]]
description = "Fixture PDF passwords in the acceptance manifest"
targetRules = ["generic-api-key"]
paths = ['''(^|/)tests/fixtures/pdf/accept/manifest\.json$''']

# Test-file names such as "p9-secret-boundary" that follow the word "key" in the test report.
[[allowlists]]
description = "Test spec names mentioned in docs"
targetRules = ["generic-api-key"]
regexes = ['''^p9-secret-boundary$''']

# The manifest `key` in wxt.config.ts is the PUBLIC half of an RSA key; it only pins the
# extension ID (Clavis Sync OAuth redirect and CORS). It grants no access and the private half
# was never kept. GitHub release ZIPs keep it; a Web Store ZIP strips it (CLAVIS_STRIP_KEY=1).
# scripts/expected-permissions.json carries the identical value so the ZIP audit accepts it.
[[allowlists]]
description = "Public manifest key (extension ID pin)"
targetRules = ["generic-api-key"]
# AND: suppress only this exact public-key literal, and only in these two files.
condition = "AND"
paths = ['''(^|/)wxt\.config\.ts$''', '''(^|/)scripts/expected-permissions\.json$''']
regexes = ['''MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA[A-Za-z0-9+/=]+''']

# server/env.e2e.example holds the e2e stack's fake signing secrets. Both are base64 of text that
# says "FAKE … not a real secret"; production secrets live only in Railway variables.
[[allowlists]]
description = "Fake e2e signing secrets in the example env file"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)server/env\.e2e\.example$''']
regexes = ['''Y2xhdmlzLWUyZS1GQUtFLX[A-Za-z0-9+/=]+''']

# Earlier commits of tests/unit/sync/s09-groq-key.test.ts used this made-up key before it was
# renamed to the gsk_TEST form; it stays in git history.
[[allowlists]]
description = "Made-up Groq key in the S-09 test's history"
targetRules = ["groq-api-key", "generic-api-key"]
regexes = ['''gsk_S09abcdefghijklmnopqrstuvwxyz0123456789ABCD''']
