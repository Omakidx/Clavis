name: CI

on:
  push:
  pull_request:

# Least privilege: no job needs to write to the repository or to issues/PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned gitleaks CLI release. The checksum comes from the release's own checksums file
  # (gitleaks_<version>_checksums.txt); update both together.
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  checks:
    name: Checks (typecheck, lint, test, build, size, ZIP audit, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Secret scanning uses the free gitleaks CLI (MIT) rather than gitleaks/gitleaks-action,
      # because the action needs a paid license for organization-owned repositories. The
      # binary is pinned and verified against a known SHA-256 before it is run.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan for secrets (git history and working tree)
        run: node scripts/scan-secrets.mjs --require

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Content-script size budget
        run: npm run size

      - name: Package release ZIP
        run: npm run zip

      - name: Audit release ZIP
        run: npm run audit:zip

      - name: Self-test the size and ZIP gates (negative tests)
        run: node scripts/selftest.mjs

      - name: Upload release ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clavis-chrome-zip
          path: .output/*-chrome.zip
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Linux needs the system libraries Chromium links against.
            playwright-install-args: '--with-deps'
          - os: windows-latest
            playwright-install-args: ''
          - os: macos-latest
            playwright-install-args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      # Playwright's bundled Chromium, not Chrome: branded Chrome 137+ ignores --load-extension.
      - name: Install Playwright Chromium
        run: npm run e2e:install -- ${{ matrix.playwright-install-args }}

      # The fixture uses Chromium's new headless mode, which supports extensions, so no xvfb is needed.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
