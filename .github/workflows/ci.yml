name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege: no job needs to write to the repository or to issues/PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned gitleaks CLI release. The checksum comes from the release's own checksums file
  # (gitleaks_<version>_checksums.txt); update the version, asset ID, and checksum together.
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_LINUX_X64_ASSET_ID: '378332058'
  GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  checks:
    name: Checks (typecheck, lint, test, build, size, ZIP audit, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Secret scanning uses the free gitleaks CLI (MIT) rather than gitleaks/gitleaks-action,
      # because the action needs a paid license for organization-owned repositories. The
      # binary is pinned and verified against a known SHA-256 before it is run.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          if ! curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; then
            # The web download route can fail while GitHub's asset API remains available.
            curl -fsSL --retry 3 -H 'Accept: application/octet-stream' -o "$archive" \
              "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_LINUX_X64_ASSET_ID}"
          fi
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan for secrets (git history and working tree)
        run: node scripts/scan-secrets.mjs --require

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Content-script size budget
        run: npm run size

      - name: Package release ZIP
        run: npm run zip

      - name: Audit release ZIP
        run: npm run audit:zip

      - name: Self-test the size and ZIP gates (negative tests)
        run: node scripts/selftest.mjs

      - name: Upload release ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clavis-chrome-zip
          path: .output/*-chrome.zip
          # .output is hidden; only the audited ZIPs selected by this pattern are uploaded.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e-shards:
    name: Browser suite (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: checks
    runs-on: ${{ matrix.os }}
    # Keep one browser worker per runner, but split the full suite across four runners per OS.
    # The unsharded 1,000+ tests exceed the job limit, especially with failure retries.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            # Linux needs the system libraries Chromium links against.
            playwright-install-args: '--with-deps'
          - os: windows-latest
            playwright-install-args: ''
          - os: macos-latest
            playwright-install-args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package extension
        # ZIP acceptance tests inspect the package on this runner, not the artifact of another job.
        run: npm run zip

      # Playwright's bundled Chromium, not Chrome: branded Chrome 137+ ignores --load-extension.
      - name: Install Playwright Chromium
        run: npm run e2e:install -- ${{ matrix.playwright-install-args }}

      - name: Install Japanese fonts for vertical-writing fixtures
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-noto-cjk

      # Only the two latency specs opt into native macOS windows. Functional suites keep the
      # extension-capable new headless mode and its viewport emulation, without requiring xvfb.
      - name: Run E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the required branch-protection check names. A gate succeeds only when every
  # browser shard on all supported operating systems succeeded; skips/cancellation fail closed.
  e2e:
    name: E2E (${{ matrix.os }})
    needs: e2e-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Require every browser shard to pass
        env:
          BROWSER_RESULT: ${{ needs.e2e-shards.result }}
        run: test "$BROWSER_RESULT" = success

  # Drives Chrome's real native UI (permission prompt, toolbar popup, context menu, keyboard
  # shortcut) with xdotool on a virtual display. Catches bugs that tab-opened extension pages
  # hide (e.g. the real popup has no tab and no frameId). Coordinates were tuned on Linux with
  # Playwright's bundled Chromium; informational until proven stable on CI runners.
  e2e-real-ui:
    name: E2E real browser UI (Linux, xvfb)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Install Playwright Chromium
        run: npm run e2e:install -- --with-deps

      # One worker: every real-UI spec drives the same X display with xdotool, so parallel
      # workers would send clicks and keystrokes into each other's browser windows.
      - name: Run real-UI tests
        env:
          CLAVIS_E2E_REAL_UI: '1'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test --workers=1 tests/e2e/spike-b-real-ui.spec.ts tests/e2e/p4-matrix-realui.spec.ts tests/e2e/p8-sidepanel-realui.spec.ts tests/e2e/p8-accept-realui.spec.ts tests/e2e/p9fix-i6-activetab-navigation.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-real-ui
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Clavis Sync end to end: the built extension against the real local API (server/), Postgres, MinIO and the
  # fake Google, plus the web dashboard's Playwright suite. The browser shards above skip these specs because
  # they have no services; CLAVIS_E2E_STACK=1 makes them run here. The service credentials match the dev
  # defaults in server/docker-compose.dev.yml, which the specs use; development values only.
  sync-e2e:
    name: Sync e2e (extension and dashboard, Linux)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clavis
          POSTGRES_PASSWORD: clavis-dev-only
          POSTGRES_DB: clavis
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clavis -d clavis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: clavis-dev
          MINIO_ROOT_PASSWORD: clavis-dev-only
          MINIO_DEFAULT_BUCKETS: clavis-dev
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLAVIS_E2E_STACK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            dashboard/package-lock.json

      - name: Install dependencies (root, server, dashboard)
        run: npm ci && npm ci --prefix server && npm ci --prefix dashboard

      - name: Install Playwright Chromium
        run: npm run e2e:install -- --with-deps

      # Each spec starts its own stack on ports 8787/8788, so they run as separate invocations.
      - name: Extension sync e2e
        run: npx playwright test tests/e2e/p11-sync.spec.ts

      - name: Extension reader-cloud e2e
        run: npx playwright test tests/e2e/p12-reader-cloud.spec.ts

      - name: Build dashboard
        run: npm run build --prefix dashboard

      - name: Dashboard e2e
        working-directory: dashboard
        run: npx playwright test

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-sync-e2e
          path: |
            playwright-report/
            test-results/
            dashboard/playwright-report/
            dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The release candidate: runs every deterministic gate once more on a clean checkout of the
  # exact commit (npm run release:check = check, build, size, zip, audit:zip --strict, selftest,
  # gitleaks, plus a second independent build that must give a byte-identical ZIP), then keeps the
  # ZIP and its SHA-256 for 90 days. Only for main and version tags, and only after the browser
  # E2E suites passed. Uploading to the Chrome Web Store stays a manual Phase 10 step.
  release-candidate:
    name: Release candidate ZIP
    needs: [checks, e2e, sync-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          if ! curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; then
            # The web download route can fail while GitHub's asset API remains available.
            curl -fsSL --retry 3 -H 'Accept: application/octet-stream' -o "$archive" \
              "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_LINUX_X64_ASSET_ID}"
          fi
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Release gate (all deterministic checks, reproducible build)
        # bash with pipefail: a failing gate must fail the step even though the log is piped to tee.
        # The log lives outside the checkout so it cannot make the tree "dirty" for --require-clean.
        shell: bash
        run: npm run release:check -- --require-clean 2>&1 | tee "$RUNNER_TEMP/release-check.log"

      - name: Summarize artifact
        run: |
          {
            echo '### Release candidate'
            echo
            echo '```'
            sed -n '/RELEASE CANDIDATE/,$p' "$RUNNER_TEMP/release-check.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release candidate ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clavis-release-candidate
          path: |
            .output/clavis-*-chrome.zip
            .output/clavis-*-chrome.zip.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  # Clavis Sync backend (docs/clavis-sync-design.md §9). Independent of the extension jobs above:
  # server/ and dashboard/ are separate npm packages, so nothing here touches the root install.
  server:
    name: Server (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clavis
          POSTGRES_PASSWORD: clavis-ci-only
          POSTGRES_DB: clavis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clavis -d clavis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # S3 for the PDF storage tests (docs/clavis-sync-design.md §6). Same frozen image as server/docker-compose.dev.yml:
      # MinIO no longer publishes images on Docker Hub, and this is the last Bitnami build. CI credentials only.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: clavis-ci
          MINIO_ROOT_PASSWORD: clavis-ci-only
          MINIO_DEFAULT_BUCKETS: clavis-test
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://clavis:clavis-ci-only@localhost:5432/clavis_test
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: clavis-test
      TEST_S3_ACCESS_KEY_ID: clavis-ci
      TEST_S3_SECRET_ACCESS_KEY: clavis-ci-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            dashboard/package-lock.json

      - name: Install server and dashboard dependencies
        run: npm ci --prefix server && npm ci --prefix dashboard

      - name: Check zod versions match across root, server and dashboard
        run: node scripts/check-zod-version.mjs

      - name: Audit production dependencies (server and dashboard)
        run: npm audit --omit=dev --audit-level=high --prefix server && npm audit --omit=dev --audit-level=high --prefix dashboard

      - name: Build dashboard
        run: npm run build --prefix dashboard

      - name: Lint dashboard
        run: npm run lint --prefix dashboard

      - name: Typecheck, lint, test and build server
        run: npm run ci --prefix server
